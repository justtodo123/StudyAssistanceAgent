name: offline-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      crawler_online_smoke:
        description: Run crawler online smoke against the public web
        type: boolean
        default: false

jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      SA_USE_VECTOR: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline runtime
        run: |
          python -m pip install -r platform/requirements.txt -r platform/requirements-dev.txt

      - name: Run protected platform baseline
        run: |
          python -m pytest platform/tests -q --tb=short

      - name: Run stage tests and regression
        run: |
          python -m pytest tests/M0_M2 tests/M3a tests/M3b tests/M3c tests/M3d tests/M4 tests/M5a tests/M5b tests/M5c tests/M5d tests/M5e tests/M6a tests/M6b tests/M8_metadata_discovery tests/M9 tests/M10 tests/regression -q --tb=short -m "not slow and not m6b_benchmark and not m9_benchmark"

      - name: Run blocking M6b offline preview benchmark
        env:
          M6B_BENCHMARK_EVIDENCE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          M6B_BENCHMARK_REPORT: reports/m6b-offline-preview-benchmark-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          python -m pytest tests/M6b -q --tb=short -m m6b_benchmark

      - name: Upload sanitized M6b benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: m6b-offline-preview-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/m6b-offline-preview-benchmark-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

      # 1K only: the external AI path is driven by a deterministic stub, so this step needs no
      # network and no credentials. 10K/100K capacity is NOT covered here (M8 BLOCKED / M11).
      - name: Run blocking M9 plan-path benchmark at 1K
        env:
          M9_BENCHMARK_EVIDENCE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          M9_BENCHMARK_REPORT: reports/m9-plan-ai-benchmark-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          python -m pytest tests/M9 -q --tb=short -m m9_benchmark

      - name: Upload sanitized M9 plan-path benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: m9-plan-ai-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/m9-plan-ai-benchmark-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

      - name: Run full RAG quality gate
        run: |
          python -m pytest tests/regression/test_rag_quality.py -q --tb=short -m slow

      - name: Run evaluation smoke
        run: |
          python tools/run_evaluation.py --smoke

  crawler-offline:
    name: crawler-offline
    runs-on: ubuntu-latest
    env:
      SA_USE_VECTOR: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler offline runtime
        run: |
          python -m pip install -r platform/requirements.txt -r platform/requirements-dev.txt -r tools/crawler/requirements.txt

      - name: Run crawler offline tests
        run: |
          python -m pytest tests/M6_crawler -q --tb=short -m "m6_crawler and not online"

      - name: Explain crawler offline failure
        if: failure()
        run: |
          echo "::error::crawler-offline failed. These tests use mocked HTTP only; inspect tests/M6_crawler ingest gates, candidate output, and eval isolation."
          exit 1

  crawler-online-smoke:
    name: crawler-online-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.crawler_online_smoke
    runs-on: ubuntu-latest
    env:
      SA_USE_VECTOR: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CRAWLER_ONLINE: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler online runtime
        run: |
          python -m pip install -r platform/requirements.txt -r platform/requirements-dev.txt -r tools/crawler/requirements.txt

      - name: Run crawler online smoke
        run: |
          python -m pytest tests/M6_crawler -q --tb=short -m "m6_crawler and online"
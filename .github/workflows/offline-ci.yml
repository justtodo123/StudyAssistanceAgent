name: offline-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      crawler_online_smoke:
        description: Run crawler online smoke against the public web
        type: boolean
        default: false
      m8_source_commit:
        description: Full ordinary commit OID for M8 governance fixtures
        type: string
        required: true

jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      SA_USE_VECTOR: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The M8 fixture commit can differ from the checked-out merge result.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline runtime
        run: |
          python -m pip install -r platform/requirements.txt -r platform/requirements-dev.txt

      - name: Run protected platform baseline
        run: |
          python -m pytest platform/tests -q --tb=short

      - name: Select M8 fixture commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ inputs.m8_source_commit }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            candidate="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            candidate="$PUSH_SHA"
            read -r -a push_lineage <<< "$(git rev-list --parents -n 1 "$candidate")"
            push_parent_count=$((${#push_lineage[@]} - 1))
            if [[ "$push_parent_count" -eq 2 ]]; then
              candidate="${push_lineage[2]}"
            elif [[ "$push_parent_count" -ne 1 ]]; then
              echo "M8 fixture selection requires an ordinary or two-parent push commit" >&2
              exit 1
            fi
          else
            candidate="$DISPATCH_SHA"
          fi

          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "M8 fixture commit must be a full lowercase 40-character OID" >&2
            exit 1
          fi
          read -r -a fixture_lineage <<< "$(git rev-list --parents -n 1 "$candidate")"
          if [[ "$((${#fixture_lineage[@]} - 1))" -ne 1 ]]; then
            echo "M8 fixture commit must have exactly one parent" >&2
            exit 1
          fi
          echo "M8_SOURCE_COMMIT=$candidate" >> "$GITHUB_ENV"

      - name: Run stage tests and regression
        run: |
          python -m pytest tests/M0_M2 tests/M3a tests/M3b tests/M3c tests/M3d tests/M4 tests/M5a tests/M5b tests/M5c tests/M5d tests/M5e tests/M6a tests/M6b tests/M8_metadata_discovery tests/M9 tests/M10 tests/M11 tests/regression -q --tb=short -m "not slow and not online and not m6b_benchmark and not m9_benchmark"

      - name: Run blocking M6b offline preview benchmark
        env:
          M6B_BENCHMARK_EVIDENCE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          M6B_BENCHMARK_REPORT: reports/m6b-offline-preview-benchmark-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          python -m pytest tests/M6b -q --tb=short -m m6b_benchmark

      - name: Upload sanitized M6b benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: m6b-offline-preview-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/m6b-offline-preview-benchmark-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

      # 1K only: the external AI path is driven by a deterministic stub, so this step needs no
      # network and no credentials. 10K/100K capacity is NOT covered here (M8 BLOCKED / M11).
      - name: Run blocking M9 plan-path benchmark at 1K
        env:
          M9_BENCHMARK_EVIDENCE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          M9_BENCHMARK_REPORT: reports/m9-plan-ai-benchmark-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          python -m pytest tests/M9 -q --tb=short -m m9_benchmark

      - name: Upload sanitized M9 plan-path benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: m9-plan-ai-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/m9-plan-ai-benchmark-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

      - name: Run full RAG quality gate
        run: |
          python -m pytest tests/regression/test_rag_quality.py -q --tb=short -m slow

      - name: Run evaluation smoke
        run: |
          python tools/run_evaluation.py --smoke

  m7-cpython311:
    name: m7-cpython311
    runs-on: ubuntu-latest
    env:
      SA_USE_VECTOR: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up exact M7 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install M7 test runtime
        run: |
          python -m pip install -r platform/requirements.txt -r platform/requirements-dev.txt
          python -m pip check

      - name: Verify exact M7 runtime contract
        run: |
          python -c "import importlib.metadata as m, platform; assert platform.python_implementation() == 'CPython'; assert platform.python_version() == '3.11.9'; print(platform.python_version()); print({name: m.version(name) for name in ('markdown-it-py', 'pypdf', 'python-pptx', 'python-docx', 'jieba')})"

      - name: Run blocking M7 suite
        run: |
          python -m pytest tests/M7 -q --tb=short -m m7

  crawler-offline:
    name: crawler-offline
    runs-on: ubuntu-latest
    env:
      SA_USE_VECTOR: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler offline runtime
        run: |
          python -m pip install -r platform/requirements.txt -r platform/requirements-dev.txt -r tools/crawler/requirements.txt

      - name: Run crawler offline tests
        run: |
          python -m pytest tests/M6_crawler -q --tb=short -m "m6_crawler and not online"

      - name: Explain crawler offline failure
        if: failure()
        run: |
          echo "::error::crawler-offline failed. These tests use mocked HTTP only; inspect tests/M6_crawler ingest gates, candidate output, and eval isolation."
          exit 1

  crawler-online-smoke:
    name: crawler-online-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.crawler_online_smoke
    runs-on: ubuntu-latest
    env:
      SA_USE_VECTOR: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CRAWLER_ONLINE: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler online runtime
        run: |
          python -m pip install -r platform/requirements.txt -r platform/requirements-dev.txt -r tools/crawler/requirements.txt

      - name: Run crawler online smoke
        run: |
          python -m pytest tests/M6_crawler -q --tb=short -m "m6_crawler and online"
[pytest]
# 测试发现路径
testpaths = tests platform/tests

# 自定义 markers（用于按阶段筛选测试）
markers =
    m3a: M3a 向量库迁移测试
    m3b: M3b 可观测性测试
    m3c: M3c 面经库测试
    m3d: M3d 文档完整性测试
    m4: M4 课程知识库规模补齐测试
    m5a: M5a 评测入口测试
    m5b: M5b 学习会话测试
    m5c: M5c 学习状态持久化测试
    m5d: M5d 学习工作台测试
    slow: 慢速测试（如 RAG 评测）

# 默认选项
addopts = -v --tb=short

# 忽略的目录
norecursedirs = .venv __pycache__ .git .claude

